name: E2E (Cucumber)

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: 24

concurrency:
  group: e2e-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  cucumber-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build SPA
        working-directory: frontend
        run: npm run build

      - name: Embed SPA + build gateway binary
        run: make embed-and-compile

      - name: Install Chromium (Playwright) + system deps
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber E2E suite
        run: bash frontend/e2e/cucumber-run.sh

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-e2e-report
          path: frontend/e2e/cucumber-report.html
          if-no-files-found: warn
